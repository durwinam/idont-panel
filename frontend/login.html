<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="robots"
      content="noindex,nofollow"
    />

    <meta
      name="theme-color"
      content="#0b1020"
    />

    <title>Sign in</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }

      html {
        background: #0b1020;
      }

      body {
        min-height: 100vh;
        overflow-x: hidden;

        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;

        background:
          radial-gradient(
            circle at 15% 15%,
            rgba(99, 102, 241, 0.30),
            transparent 35%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(139, 92, 246, 0.24),
            transparent 35%
          ),
          linear-gradient(
            135deg,
            #eef2ff 0%,
            #f5f3ff 45%,
            #ecfeff 100%
          );
      }

      #message,
      #app {
        position: relative;
        z-index: 1;
      }

      #app {
        min-height: 100vh;
      }

      /* Background light effects */

      body::before,
      body::after {
        content: "";

        position: fixed;

        width: 420px;
        height: 420px;

        border-radius: 50%;

        pointer-events: none;

        filter: blur(100px);

        z-index: 0;
      }

      body::before {
        top: -180px;
        left: -120px;

        background:
          rgba(99, 102, 241, 0.28);

        animation:
          float-one 18s ease-in-out infinite alternate;
      }

      body::after {
        right: -140px;
        bottom: -180px;

        background:
          rgba(20, 184, 166, 0.24);

        animation:
          float-two 22s ease-in-out infinite alternate;
      }

      @keyframes float-one {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(120px, 100px);
        }
      }

      @keyframes float-two {
        from {
          transform: translate(0, 0);
        }

        to {
          transform: translate(-100px, -80px);
        }
      }

      /* Dark mode */

      @media (prefers-color-scheme: dark) {
        html {
          background: #05070d;
        }

        body {
          background:
            radial-gradient(
              circle at 15% 15%,
              rgba(59, 130, 246, 0.18),
              transparent 35%
            ),
            radial-gradient(
              circle at 85% 80%,
              rgba(139, 92, 246, 0.16),
              transparent 35%
            ),
            linear-gradient(
              135deg,
              #080b14 0%,
              #0b1020 50%,
              #05070d 100%
            );
        }

        body::before {
          background:
            rgba(59, 130, 246, 0.18);
        }

        body::after {
          background:
            rgba(139, 92, 246, 0.15);
        }
      }

      /* Prevent ugly white flash */

      #app:empty {
        min-height: 100vh;
      }

      /* Mobile */

      @media (max-width: 600px) {
        body {
          background:
            radial-gradient(
              circle at 50% 0%,
              rgba(99, 102, 241, 0.22),
              transparent 42%
            ),
            linear-gradient(
              145deg,
              #eef2ff,
              #f8f5ff
            );
        }
      }

      @media (prefers-color-scheme: dark) and (max-width: 600px) {
        body {
          background:
            radial-gradient(
              circle at 50% 0%,
              rgba(59, 130, 246, 0.16),
              transparent 42%
            ),
            linear-gradient(
              145deg,
              #080b14,
              #05070d
            );
        }
      }

      /* Reduced motion */

      @media (prefers-reduced-motion: reduce) {
        body::before,
        body::after {
          animation: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="message"></div>

    <div id="app"></div>

    <script
      type="module"
      src="/src/entries/login.tsx"
    ></script>
  </body>
</html>
